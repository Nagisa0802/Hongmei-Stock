<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏美冷凍庫存管理系統 (多人即時連線版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Firebase 9+ 相容版 SDK (無需 Webpack，單一檔案即可運作) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-28 select-none">
    <!-- Top Header -->
    <header class="bg-slate-800/95 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40 px-4 py-3 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
                    <i class="fa-solid fa-snowflake text-sm"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white tracking-wide">宏美冷凍庫存系統</h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span id="roleBadge" class="text-[10px] px-1.5 py-0.2 rounded font-medium bg-slate-700 text-slate-300 border border-slate-600">訪客查詢模式</span>
                        <span id="syncStatusBadge" class="text-[10px] text-emerald-400 flex items-center gap-1">
                            <i class="fa-solid fa-cloud text-[9px]"></i> 雲端即時連線中
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <button onclick="toggleRoleModal()" id="btnRoleToggle" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-slate-600 bg-slate-700/80 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1">
                    <i class="fa-solid fa-lock text-[11px] text-amber-400" id="roleIcon"></i>
                    <span id="roleText">登入</span>
                </button>
                <button onclick="openAddModal()" id="btnTopAdd" class="hidden px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium shadow-md transition flex items-center gap-1">
                    <i class="fa-solid fa-plus text-[10px]"></i> 新增
                </button>
            </div>
        </div>
    </header>

    <!-- INVENTORY VIEW -->
    <div id="view-inventory" class="space-y-3">
        <!-- Search & Filter Controls -->
        <div class="max-w-md mx-auto p-4 space-y-3 pb-0">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="renderInventory()" placeholder="搜尋品名、貨編..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 shadow-inner">
            </div>

            <!-- Warehouse & Expiry filter chips -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                <button onclick="setFilter('all')" id="btn-all" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium whitespace-nowrap shadow-sm">全部 (3-5-下)</button>
                <button onclick="setFilter('A3')" id="btn-A3" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 whitespace-nowrap">A3冰庫</button>
                <button onclick="setFilter('A5')" id="btn-A5" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 whitespace-nowrap">A5冰庫</button>
                <button onclick="setFilter('下營')" id="btn-下營" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 whitespace-nowrap">下營冰庫</button>
                <button onclick="setFilter('A2')" id="btn-A2" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 whitespace-nowrap">A2庫</button>
                <button onclick="setFilter('expired')" id="btn-expired" class="px-3 py-1.5 rounded-lg bg-rose-950/60 border border-rose-800/80 text-rose-300 whitespace-nowrap flex items-center gap-1">
                    <i class="fa-solid fa-triangle-exclamation text-[10px]"></i> 已過期
                </button>
            </div>
            
            <div class="flex justify-between items-center text-[11px] text-slate-400 px-1">
                <span id="listCountInfo">顯示 0 筆資料</span>
                <span class="text-amber-400/90 text-[10px]"><i class="fa-solid fa-bell text-[9px] mr-1"></i>黃色標註：30天內即期</span>
            </div>
        </div>

        <!-- Inventory List Cards -->
        <main class="max-w-md mx-auto px-4 space-y-2.5" id="cardContainer">
            <!-- Populated via JS -->
        </main>
    </div>

    <!-- HISTORY VIEW -->
    <div id="view-history" class="hidden max-w-md mx-auto p-4 space-y-3">
        <div class="flex justify-between items-center bg-slate-800 border border-slate-700 p-3 rounded-xl shadow-sm">
            <div>
                <h2 class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> 進出貨與異動紀錄
                </h2>
                <p class="text-[10px] text-slate-400 mt-0.5">即時同步於雲端資料庫</p>
            </div>
        </div>

        <div id="historyContainer" class="space-y-2">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- ITEM DETAIL HISTORY MODAL -->
    <div id="itemDetailModal" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-start border-b border-slate-700 pb-2.5">
                <div>
                    <h3 class="text-xs font-bold text-white" id="detailItemName">品名紀錄</h3>
                    <p class="text-[10px] text-slate-400 mt-0.5" id="detailItemCode">貨編 -</p>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white p-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="detailLogsList" class="max-h-60 overflow-y-auto space-y-2 pr-1 text-xs"></div>
            <button onclick="closeDetailModal()" class="w-full py-2 bg-slate-700 text-slate-200 rounded-xl text-xs font-medium">關閉</button>
        </div>
    </div>

    <!-- STOCK IN / OUT MODAL -->
    <div id="actionModal" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-3.5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 id="modalTitle" class="text-sm font-bold text-white">庫存異動</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="modalItemInfo" class="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/60"></p>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">異動日期</label>
                <input type="date" id="modalDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">異動數量 (箱/件)</label>
                <input type="number" id="modalQty" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="請輸入數量">
            </div>

            <div id="modalExpirySection" class="p-2.5 bg-slate-900/80 border border-slate-700 rounded-xl space-y-2">
                <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                    <input type="checkbox" id="checkUpdateExpiry" onchange="toggleExpiryInput()" class="rounded border-slate-700 text-blue-600 focus:ring-0">
                    <span>同步更新有效日期？</span>
                </label>
                <div id="newExpiryInputContainer" class="hidden pt-1">
                    <label class="block text-[10px] text-slate-400 mb-1">新有效日期</label>
                    <input type="date" id="modalNewExpiry" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-xs text-white">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">備註說明</label>
                <input type="text" id="modalRemark" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="例如：新進貨批次 / 客戶出貨">
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="closeModal()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium">取消</button>
                <button onclick="confirmAction()" id="btnSubmitAction" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium shadow-md flex items-center justify-center gap-1">
                    <span>確認送出</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ADD ITEM MODAL -->
    <div id="addModal" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-3 shadow-2xl">
            <h3 class="text-sm font-bold text-white border-b border-slate-700 pb-2">新增冷凍庫存品項</h3>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">庫別</label>
                <select id="addWarehouse" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="A3">A3冰庫</option>
                    <option value="A5">A5冰庫</option>
                    <option value="下營">下營冰庫</option>
                    <option value="A2">A2庫</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">貨編</label>
                <input type="text" id="addCode" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="例如：N65-099">
            </div>
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">品名 / 規格描述</label>
                <input type="text" id="addName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" placeholder="例如：冷凍草莓 10K">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">有效日期</label>
                    <input type="date" id="addExpiry" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">初始箱數</label>
                    <input type="number" id="addBoxes" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2 text-xs text-white" value="100">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeAddModal()" class="flex-1 py-2 bg-slate-700 text-slate-200 rounded-xl text-xs font-medium">取消</button>
                <button onclick="saveNewItem()" id="btnSaveNewItem" class="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-medium shadow-md">確認建立</button>
            </div>
        </div>
    </div>

	<!-- LOGIN MODAL (內部員工登入視窗) -->
	<div id="roleModal" class="fixed inset-0 bg-black/75 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
		<div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-3.5 shadow-2xl">
			<h3 class="text-sm font-bold text-white flex items-center gap-2">
				<i class="fa-solid fa-shield-halved text-amber-400"></i> 內部人員登入
			</h3>
			<p class="text-xs text-slate-400">本系統僅限內部授權人員使用，請輸入公司專屬帳號密碼：</p>
			
			<div class="space-y-2">
				<div>
					<label class="block text-[11px] text-slate-400 mb-1">員工帳號 / 信箱</label>
					<input type="email" id="loginEmail" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="請輸入帳號">
				</div>
				<div>
					<label class="block text-[11px] text-slate-400 mb-1">登入密碼</label>
					<input type="password" id="loginPassword" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="請輸入密碼">
				</div>
			</div>

			<div class="flex gap-2 pt-1">
				<button onclick="closeRoleModal()" class="flex-1 py-2 bg-slate-700 text-slate-200 rounded-xl text-xs font-medium">取消</button>
				<button onclick="handleLogin()" id="btnLoginSubmit" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium shadow-md">登入驗證</button>
			</div>
		</div>
	</div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 z-40 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center text-xs">
            <button onclick="switchView('inventory')" id="bottomNavInv" class="flex flex-col items-center gap-1 text-blue-400 font-medium">
                <i class="fa-solid fa-boxes-stacked text-base"></i>
                <span>庫存清單</span>
            </button>
            <button onclick="switchView('history')" id="bottomNavHist" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-clock-rotate-left text-base"></i>
                <span>異動紀錄</span>
            </button>
            <button onclick="exportDataJson()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-cloud-arrow-down text-base"></i>
                <span>備份匯出</span>
            </button>
        </div>
    </nav>

        // 核心：Firebase Realtime 雙向監聽機制
        function setupRealtimeDatabase() {
            const statusBadge = document.getElementById('syncStatusBadge');

            // 1. 監聽品項庫存變更 (毫秒級推播)
            db.ref('inventory').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    inventory = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
                } else {
                    // 若資料庫為全新空表，主動推送初始種子資料
                    const initMap = {};
                    completeInventory.forEach(item => { initMap[item.id] = item; });
                    db.ref('inventory').set(initMap);
                    inventory = completeInventory;
                }
                statusBadge.innerHTML = '<i class="fa-solid fa-circle-check text-[9px] text-emerald-400"></i> 即時連線中';
                renderInventory();
            }, (error) => {
                console.error("同步失敗:", error);
                statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-[9px] text-rose-400"></i> 連線中斷';
            });

			// 監聽異動紀錄
			db.ref('history').limitToLast(100).on('value', (snapshot) => {
				const data = snapshot.val();
				if (data) {
					// Firebase push 出來的是以 key 為鍵的物件，轉成陣列並倒序排列（最新在最前）
					historyLogs = Object.values(data).reverse();
				} else {
					historyLogs = [];
				}
				renderHistory();
			});
        }

		// 處理登入
		async function handleLogin() {
			const email = document.getElementById('loginEmail').value.trim();
			const password = document.getElementById('loginPassword').value.trim();
			const btn = document.getElementById('btnLoginSubmit');

			if (!email || !password) {
				alert('請輸入帳號與密碼');
				return;
			}

			try {
				btn.disabled = true;
				btn.innerText = '驗證中...';
				// 使用 Firebase Auth 登入
				await firebase.auth().signInWithEmailAndPassword(email, password);
				closeRoleModal();
				alert('登入成功！');
			} catch (error) {
				let msg = '登入失敗：' + error.message;
				if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
					msg = '帳號或密碼錯誤，請確認！';
				}
				alert(msg);
			} finally {
				btn.disabled = false;
				btn.innerText = '登入驗證';
			}
		}

		// 處理登出 / 切換模式
		function toggleRoleModal() {
			if (firebase.auth().currentUser) {
				if (confirm('確定要登出系統嗎？')) {
					firebase.auth().signOut().then(() => {
						alert('已成功登出');
					});
				}
			} else {
				document.getElementById('loginEmail').value = '';
				document.getElementById('loginPassword').value = '';
				document.getElementById('roleModal').classList.remove('hidden');
			}
		}

		// 核心：登入狀態與角色權限監聽
		firebase.auth().onAuthStateChanged(async (user) => {
			const roleBadge = document.getElementById('roleBadge');
			const roleIcon = document.getElementById('roleIcon');
			const roleText = document.getElementById('roleText');
			const btnTopAdd = document.getElementById('btnTopAdd');

			if (user) {
				// 1. 已登入任何內部帳號：具備資料庫讀取權限，開始載入庫存
				setupRealtimeDatabase();

				// 2. 向伺服器確認此 UID 是否在管理員清單內
				try {
					const adminSnap = await db.ref(`admins/${user.uid}`).once('value');
					isAdmin = (adminSnap.val() === true);
				} catch (e) {
					isAdmin = false;
				}

				// 3. 依照角色更新介面
				if (isAdmin) {
					roleBadge.className = 'text-[10px] px-1.5 py-0.2 rounded font-medium bg-amber-500/20 text-amber-300 border border-amber-500/40';
					roleBadge.innerText = `${user.email.split('@')[0]} (系統管理者)`;
					roleIcon.className = 'fa-solid fa-user-shield text-[11px] text-amber-400';
					btnTopAdd.classList.remove('hidden'); // 顯示新增按鈕
				} else {
					roleBadge.className = 'text-[10px] px-1.5 py-0.2 rounded font-medium bg-blue-500/20 text-blue-300 border border-blue-500/40';
					roleBadge.innerText = `${user.email.split('@')[0]} (一般人員)`;
					roleIcon.className = 'fa-solid fa-user text-[11px] text-blue-400';
					btnTopAdd.classList.add('hidden'); // 隱藏新增按鈕
				}

				roleText.innerText = '登出';
				closeRoleModal();
			} else {
				// 未登入：徹底阻擋
				isAdmin = false;
				roleBadge.className = 'text-[10px] px-1.5 py-0.2 rounded font-medium bg-rose-500/20 text-rose-300 border border-rose-500/40';
				roleBadge.innerText = '未登入 (無權限)';
				roleIcon.className = 'fa-solid fa-lock text-[11px] text-rose-400';
				roleText.innerText = '登入';
				btnTopAdd.classList.add('hidden');

				// 清空畫面
				inventory = [];
				historyLogs = [];
				renderInventory();
				renderHistory();

				// 彈出登入視窗
				document.getElementById('roleModal').classList.remove('hidden');
			}

			renderInventory();
		});

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'A3', 'A5', '下營', 'A2', 'expired'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (!btn) return;
                if (f === filterType) {
                    btn.className = f === 'expired' 
                        ? 'px-3 py-1.5 rounded-lg bg-rose-600 text-white font-medium whitespace-nowrap shadow-sm flex items-center gap-1'
                        : 'px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium whitespace-nowrap shadow-sm';
                } else {
                    btn.className = f === 'expired'
                        ? 'px-3 py-1.5 rounded-lg bg-rose-950/60 border border-rose-800/80 text-rose-300 whitespace-nowrap flex items-center gap-1'
                        : 'px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 whitespace-nowrap';
                }
            });
            renderInventory();
        }

        function getWarehouseOrder(wh) {
            if (wh === 'A3') return 1;
            if (wh === 'A5') return 2;
            if (wh === '下營') return 3;
            if (wh === 'A2') return 4;
            return 5;
        }

        function renderInventory() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            const today = new Date();

            let sortedList = [...inventory].sort((a, b) => {
                const orderDiff = getWarehouseOrder(a.warehouse) - getWarehouseOrder(b.warehouse);
                if (orderDiff !== 0) return orderDiff;
                return (Number(a.id) || 0) - (Number(b.id) || 0);
            });

            const filtered = sortedList.filter(item => {
                const matchKw = (String(item.code || '') + String(item.name || '') + (item.spec || '')).toLowerCase().includes(keyword);
                let isExpired = false;
                if (item.expiry && String(item.expiry).match(/^\d{4}-\d{2}-\d{2}$/)) {
                    const expDate = new Date(item.expiry);
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) isExpired = true;
                }
                if (currentFilter === 'all') return matchKw;
                if (currentFilter === 'expired') return matchKw && isExpired;
                return matchKw && (item.warehouse === currentFilter);
            });

            document.getElementById('listCountInfo').innerText = `顯示 ${filtered.length} 筆品項`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 text-xs"><i class="fa-solid fa-box-open text-2xl mb-2 text-slate-600 block"></i>無符合條件的庫存資料</div>';
                return;
            }

            const warehouseCounters = { 'A3': 0, 'A5': 0, '下營': 0, 'A2': 0, '其他': 0 };

            filtered.forEach(item => {
                const whKey = warehouseCounters[item.warehouse] !== undefined ? item.warehouse : '其他';
                warehouseCounters[whKey]++;
                const itemIndex = warehouseCounters[whKey];

                let badgeColor = 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                if (item.warehouse === 'A5') badgeColor = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                if (item.warehouse === '下營') badgeColor = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                if (item.warehouse === 'A2') badgeColor = 'bg-purple-500/20 text-purple-400 border-purple-500/30';

                let expiryText = item.expiry || '未填寫';
                let expiryBadge = '';
                let cardBorderClass = 'border-slate-700/80';
                if (item.expiry && String(item.expiry).match(/^\d{4}-\d{2}-\d{2}$/)) {
                    const expDate = new Date(item.expiry);
                    const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) {
                        expiryBadge = '<span class="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-1.5 py-0.5 rounded font-bold">已過期</span>';
                        cardBorderClass = 'border-rose-700/60 bg-rose-950/10';
                    } else if (diffDays <= 30) {
                        expiryBadge = `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded font-bold">即期 (${diffDays}天)</span>`;
                        cardBorderClass = 'border-amber-600/60 bg-amber-950/10';
                    }
                }

                let actionButtonsHtml = '';
                if (isAdmin) {
                    actionButtonsHtml = `
                        <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-700/40">
                            <button onclick="openModal('${item.id}', 'in')" class="py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-plus text-[10px]"></i> 進貨
                            </button>
                            <button onclick="openModal('${item.id}', 'out')" class="py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-minus text-[10px]"></i> 出貨
                            </button>
                            <button onclick="openItemHistory('${item.id}')" class="py-1.5 bg-slate-700/80 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-clock-rotate-left text-[10px] text-blue-400"></i> 紀錄
                            </button>
                        </div>
                    `;
                } else {
                    actionButtonsHtml = `
                        <div class="pt-1 border-t border-slate-700/40">
                            <button onclick="openItemHistory('${item.id}')" class="w-full py-1.5 bg-slate-700/70 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                                <i class="fa-solid fa-clock-rotate-left text-[10px] text-blue-400"></i> 查看紀錄
                            </button>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `bg-slate-800 border ${cardBorderClass} rounded-2xl p-3.5 space-y-2.5 shadow-sm`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border ${badgeColor}">${item.warehouse}庫</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-mono bg-slate-700/70 text-slate-300">項次 #${itemIndex}</span>
                                <span class="text-xs font-mono text-slate-400">${item.code || '-'}</span>
                            </div>
                            <h2 class="text-sm font-bold text-white tracking-wide">${item.name}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-black text-emerald-400">${item.boxes}</span>
                            <span class="text-xs text-slate-400"> 箱</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center text-xs text-slate-300 pt-1">
                        <div>規格: <span class="text-slate-200">${item.spec || '-'}</span></div>
                        <div class="flex items-center gap-1.5">
                            <span>效期: ${expiryText}</span>
                            ${expiryBadge}
                        </div>
                    </div>

                    ${actionButtonsHtml}
                `;
                container.appendChild(card);
            });

        function openItemHistory(itemId) {
            const item = inventory.find(i => String(i.id) === String(itemId));
            if (!item) return;

            document.getElementById('detailItemName').innerText = `${item.name} (${item.warehouse}庫)`;
            document.getElementById('detailItemCode').innerText = `貨編：${item.code || '無'} | 規格：${item.spec} | 現存：${item.boxes} 箱`;

            const listContainer = document.getElementById('detailLogsList');
            listContainer.innerHTML = '';

            const logs = historyLogs.filter(l => String(l.itemId) === String(itemId) || l.name === item.name);

            if (logs.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">此品項尚無歷史紀錄</div>';
            } else {
                logs.forEach(l => {
                    let typeTag = l.type === 'add'
                        ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-400 border border-blue-500/30">新增品項</span>'
                        : (l.type === 'in' ? '<span class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">進貨</span>' : '<span class="px-1.5 py-0.5 rounded text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30">出貨</span>');

                    let qtyDisplay = l.type === 'add'
                        ? `<span class="text-blue-400 font-bold">初始 ${l.qty} 箱</span>`
                        : (l.type === 'in' ? `<span class="text-emerald-400 font-bold">+${l.qty} 箱</span>` : `<span class="text-rose-400 font-bold">-${l.qty} 箱</span>`);

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'p-2.5 bg-slate-900/80 border border-slate-700/60 rounded-xl space-y-1';
                    itemDiv.innerHTML = `
                        <div class="flex justify-between items-center text-xs">
                            <div class="flex items-center gap-1.5">${typeTag} <span class="text-slate-400 text-[10px]">${l.date}</span></div>
                            <div>${qtyDisplay}</div>
                        </div>
                        <p class="text-[11px] text-slate-300">備註: ${l.remark || '無'}</p>
                    `;
                    listContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('itemDetailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('itemDetailModal').classList.add('hidden');
        }

        function openModal(id, type) {
            if (!isAdmin) return;
            activeItem = inventory.find(i => String(i.id) === String(id));
            activeType = type;
            if (!activeItem) return;

            document.getElementById('modalTitle').innerText = type === 'in' ? '📦 貨品進貨 (即時連線)' : '📤 貨品出貨 (即時連線)';
            document.getElementById('modalItemInfo').innerText = `品名：${activeItem.name} (${activeItem.warehouse}庫)\n現有箱數：${activeItem.boxes} 箱 | 原效期：${activeItem.expiry || '無'}`;
            document.getElementById('modalQty').value = '';
            document.getElementById('modalRemark').value = '';

            const todayStr = new Date().toISOString().slice(0, 10);
            document.getElementById('modalDate').value = todayStr;

            const expirySection = document.getElementById('modalExpirySection');
            const checkUpdateExpiry = document.getElementById('checkUpdateExpiry');
            const modalNewExpiry = document.getElementById('modalNewExpiry');
            if (type === 'in') {
                expirySection.classList.remove('hidden');
                checkUpdateExpiry.checked = false;
                document.getElementById('newExpiryInputContainer').classList.add('hidden');
                modalNewExpiry.value = activeItem.expiry || todayStr;
            } else {
                expirySection.classList.add('hidden');
            }

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function toggleExpiryInput() {
            const isChecked = document.getElementById('checkUpdateExpiry').checked;
            document.getElementById('newExpiryInputContainer').classList.toggle('hidden', !isChecked);
        }

        function closeModal() {
            document.getElementById('actionModal').classList.add('hidden');
            activeItem = null;
        }

        async function confirmAction() {
            const qty = parseInt(document.getElementById('modalQty').value);
            const dateStr = document.getElementById('modalDate').value || new Date().toISOString().slice(0, 10);
            let remark = document.getElementById('modalRemark').value.trim();
            const btn = document.getElementById('btnSubmitAction');

            if (isNaN(qty) || qty <= 0) {
                alert('請輸入大於 0 的正確數量');
                return;
            }

            let expiryChangeNote = '';
            let newExpiryValue = '';
            let targetBoxes = activeItem.boxes;

            if (activeType === 'in') {
                targetBoxes += qty;
                if (document.getElementById('checkUpdateExpiry').checked) {
                    const newExp = document.getElementById('modalNewExpiry').value;
                    if (newExp) {
                        expiryChangeNote = ` (效期更新為 ${newExp})`;
                        newExpiryValue = newExp;
                    }
                }
            } else {
                if (activeItem.boxes < qty) {
                    alert('庫存不足，無法出貨！');
                    return;
                }
                targetBoxes -= qty;
            }

            const finalRemark = (remark || (activeType === 'in' ? '進貨' : '出貨')) + expiryChangeNote;

            try {
                btn.disabled = true;
                
			// 寫入指定品項
			const updatePayload = { 
				boxes: targetBoxes,
				authKey: 'hm8888' // 加上密鑰驗證
			};
			if (newExpiryValue) updatePayload.expiry = newExpiryValue;
			await db.ref(`inventory/${activeItem.id}`).update(updatePayload);

			// 寫入歷史紀錄
			await db.ref('history').push({
				itemId: activeItem.id,
				date: dateStr,
				type: activeType,
				name: activeItem.name,
				warehouse: activeItem.warehouse,
				qty: qty,
				remark: finalRemark,
				authKey: 'hm8888', // 加上密鑰驗證
				timestamp: firebase.database.ServerValue.TIMESTAMP
			});

                closeModal();
            } catch (err) {
                alert('操作失敗，請檢查網路連線：' + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function openAddModal() {
            if (!isAdmin) return;
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        async function saveNewItem() {
            const warehouse = document.getElementById('addWarehouse').value;
            const code = document.getElementById('addCode').value.trim();
            const name = document.getElementById('addName').value.trim();
            const expiry = document.getElementById('addExpiry').value || '2027-12-31';
            const boxes = parseInt(document.getElementById('addBoxes').value) || 0;
            const dateStr = new Date().toISOString().slice(0, 10);
            const btn = document.getElementById('btnSaveNewItem');

            if (!name) {
                alert('請輸入品名');
                return;
            }

            const newItemId = Date.now();
            const newItem = {
                id: newItemId,
                warehouse,
                code: code || 'N/A',
                name,
                spec: '10 KG',
                expiry,
                boxes
            };

            try {
                btn.disabled = true;
                // 即時推播新增品項
                await db.ref(`inventory/${newItemId}`).set(newItem);
                await db.ref('history').push({
                    itemId: newItemId,
                    date: dateStr,
                    type: 'add',
                    name: name,
                    warehouse: warehouse,
                    qty: boxes,
                    remark: `建立新品項 (初始有效日期: ${expiry})`,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                closeAddModal();
                alert(`已成功建立品項「${name}」！`);
            } catch (err) {
                alert('建立品項失敗：' + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (historyLogs.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 text-xs">尚無任何異動紀錄</div>';
                return;
            }

            historyLogs.forEach(log => {
                let badgeHtml = log.type === 'add'
                    ? '<span class="px-1.5 py-0.5 rounded font-bold border bg-blue-500/20 text-blue-400 border-blue-500/30 text-[10px]">新增品項</span>'
                    : (log.type === 'in' ? '<span class="px-1.5 py-0.5 rounded font-bold border bg-emerald-500/20 text-emerald-400 border-emerald-500/30 text-[10px]">進貨</span>' : '<span class="px-1.5 py-0.5 rounded font-bold border bg-rose-500/20 text-rose-400 border-rose-500/30 text-[10px]">出貨</span>');

                let qtyText = log.type === 'add'
                    ? `<span class="text-sm font-bold text-blue-400">初始 ${log.qty} 箱</span>`
                    : (log.type === 'in' ? `<span class="text-sm font-bold text-emerald-400">+${log.qty} 箱</span>` : `<span class="text-sm font-bold text-rose-400">-${log.qty} 箱</span>`);

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex justify-between items-center text-xs';
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            ${badgeHtml}
                            <span class="text-slate-200 font-bold">${log.name}</span>
                            <span class="text-slate-400 text-[11px]">(${log.warehouse}庫)</span>
                        </div>
                        <p class="text-slate-400 text-[10px]">日期: ${log.date} | 說明: ${log.remark}</p>
                    </div>
                    <div class="text-right">
                        ${qtyText}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchView(viewName) {
            const invView = document.getElementById('view-inventory');
            const histView = document.getElementById('view-history');
            const bottomNavInv = document.getElementById('bottomNavInv');
            const bottomNavHist = document.getElementById('bottomNavHist');

            if (viewName === 'inventory') {
                invView.classList.remove('hidden');
                histView.classList.add('hidden');
                bottomNavInv.className = 'flex flex-col items-center gap-1 text-blue-400 font-medium';
                bottomNavHist.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200';
                renderInventory();
            } else {
                invView.classList.add('hidden');
                histView.classList.remove('hidden');
                bottomNavHist.className = 'flex flex-col items-center gap-1 text-blue-400 font-medium';
                bottomNavInv.className = 'flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200';
                renderHistory();
            }
        }

        function exportDataJson() {
            const backup = {
                exportDate: new Date().toISOString(),
                inventory: inventory,
                history: historyLogs
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `宏美冷凍庫存資料備份_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.onload = function() {
            updateRoleUI();
            setupRealtimeDatabase();
        };
    </script>
</body>
</html>
